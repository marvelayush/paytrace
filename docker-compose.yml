# Local development database. Production uses Neon.
services:
  db:
    image: postgres:16-alpine
    container_name: paytrace-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paytrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paytrace}
      POSTGRES_DB: ${POSTGRES_DB:-paytrace}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paytrace}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
